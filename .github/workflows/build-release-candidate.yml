name: Build Release Candidate

on:
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill directory name, for example copy-paste-guard"
        required: true
        type: string
      version:
        description: "Semantic version, for example v1.0.1"
        required: true
        default: "v1.0.1"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build candidate ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python tools/validate_public_skills.py

      - name: Build release candidate
        run: python tools/build_release_candidate.py "${{ inputs.skill }}" "${{ inputs.version }}"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.skill }}-${{ inputs.version }}-candidate"
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
